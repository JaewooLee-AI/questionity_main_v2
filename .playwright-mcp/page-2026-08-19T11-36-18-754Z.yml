                  - paragraph [ref=e615]: "It was Londoner Flo Dill’s first time in Sydney, and she came with notes. “Like everyone, I ask friends who’ve been there before — but I try to get just two or three top things,” the NTS Breakfast Show host says. She’d come to romance Ace Sydney’s Lobby with her signature blend of leftfield pop and feather-light rock, and to try out a new way to travel. “I’m trying to free myself from the tyranny of Google Maps and just go where it feels good.” Her hot take: “Not every meal needs to be life changing.” Alongside friends, Flo also polled her devoted NTS listeners for their can’t-miss spots, which is how she discovered the gem that is Wendy Whiteley’s Secret Garden — right at home on her outdoorsy-leaning list."
