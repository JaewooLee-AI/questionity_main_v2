                      - text: Willem Verbeeck’s Perfect New York Day
                  - paragraph [ref=e715]: "The Los Angeles-based photographer balances assignments for the likes of Rolling Stone and the New Yorker with personal projects driven by long walks through otherworldly landscapes. Raised in the New York tri-state area, he spent a weekend with us during a recent trip back east, doing what he loves: strolling through Manhattan accompanied by his camera. Below are a few of the stops Willem made along the way."
