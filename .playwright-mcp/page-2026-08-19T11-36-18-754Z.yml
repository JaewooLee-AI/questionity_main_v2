                  - paragraph [ref=e770]: Founder of the eponymous, pared-back line of natural skincare staples F. Miller, Fran Miller is a person we trust. We trust her to make our hair soft and our skin strong. We also trust her taste in Toronto, the city she’s based, where F. Miller’s products are designed, formulated and bottled by hand. Here, we share all-inclusive list of her local haunts, from fresh flowers to designer vintage to advice on accessing the Cheese Boutique’s cheese vault.
