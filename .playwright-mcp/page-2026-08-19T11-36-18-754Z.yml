                      - text: An Endless Art Practice
                  - paragraph [ref=e737]: It’s her studio, but to a passerby Hyungi Park would seem out of place. A vision in all black, the 28-year-old artist dons only a trace of color — the smattering of red tattoos that start on her left cheek and snake their way down her neck and arms, punctuating the thick collage of black ink. Her studio, on the other hand, is almost ethereal. Its white walls hold shelves brimming with machines, tools and containers of organic materials that Hyungi foraged, found or made.
