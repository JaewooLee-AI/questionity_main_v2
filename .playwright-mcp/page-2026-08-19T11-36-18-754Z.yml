                  - paragraph [ref=e704]: “It’s an incoherent archive of contemporary Greek culture,” says Greek Visions founder Takis Zontiros. What began as an Instagram account cataloguing movements and moments in Greece’s past and recent present — 1970s to 2010s — grew long, curious arms. Greek Visions resembles a virtual museum preserving the minute and monumental of the country’s cultural identity, its reach now spanning a popular Instagram account, regular merch drops and a Substack. Newly notched in the brand’s résumé — curator of the in-room vinyl at Ace Hotel & Swim Club Athens (hear a preview here) and collaborator on an apparel collection that revives the decadence of Greek discotheques.
                  - link [ref=e706] [cursor=pointer]:
                    - /url: https://acehotel.com/greek-visions-finds-meaning-in-incoherence/
                    - text: Read More
              - generic [ref=e708]:
