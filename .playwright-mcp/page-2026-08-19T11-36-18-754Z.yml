                      - text: Soy Sauce, Like a Fine Wine
                  - paragraph [ref=e748]: "Eri Miyagi and Miki Nomura started Brooklyn-based Japanese condiment company Cabi Foods in 2022 for multitude reasons. One, their love of a really good mold called koji. Two, to share the Japanese home cooking they grew up on and its inherent emphasis on flavor and fresh ingredients. And to destroy the idea of Japanese condiments that “just sit there.” Launching with a yuzu vinegar, dashi soy sauce and sansho peppercorn miso — all sourced from small, regional producers — Cabi condiments focus on Japanese-specific flavors that go with anything: kale, chicken, vanilla ice cream."
