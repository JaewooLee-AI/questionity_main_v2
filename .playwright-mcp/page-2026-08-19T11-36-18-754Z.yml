                  - paragraph [ref=e782]: Shane Thomas and Saturn Risin9 are luminous. Tucked into an Ace Suite in DTLA at magic hour, buzzing with a magnetic, conspiratorial energy — plus cunning wit cut with vulnerability — it’s clear the two multi-faceted creators have a direct aux cord to the source — both together and individually. In advance of Blush!’s sure-to-be sickening soirée over Pride weekend at Ace Hotel Palm Springs, Shane and Saturn join us in dialogue.
