                      - text: Corey Wash Walks on the “Sunny Side”
                  - paragraph [ref=e726]: Don’t forget to log off. That’s the gist of “Sunny Side,” Corey Wash’s commission for the Palm Springs mural wall, which gets a refresh every spring in time for Desert Gold, our Coachella-season shindig. The painting, a riotously colorful ode to communing with nature, isn’t just a call to get off your phone, but more broadly to take a step back and think about what matters.
