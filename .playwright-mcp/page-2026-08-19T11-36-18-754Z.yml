                      - text: "Packing List: Madison Cunningham"
                  - paragraph [ref=e604]: "Joan Didion authored many American classics — her shortest: a packing list published in 1979. The list, from her collection The White Album, was kept taped to the door of her Hollywood apartment closet for utilization at a moment’s notice. A tidy catalog of things that includes both stockings and bourbon, we often turn to Joan when staring down an empty suitcase. All this to say, we’re excited to introduce Packing List — a new Reader feature chronicling the tried-and-true travel companions of the wayfarers we know and love. Singer-songwriter Madison Cunningham kicks off the series as she tours in support of her fourth studio album, Ace (a coincidence, we swear)."
