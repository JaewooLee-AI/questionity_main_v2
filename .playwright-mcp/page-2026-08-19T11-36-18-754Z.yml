                  - paragraph [ref=e592]: "TO·BE·LONGING introduces fluidity to domesticity, subverting historically defined heteronormative ideals of the home. The installation, the work of architect Quan Thai, rethinks the rigidity of home for those who do not conform. On display: nearly 40 artifacts received in response to the query, “What makes your home queer?” Here, Quan shares a selection of objects manifesting queerness in homes across North America."
