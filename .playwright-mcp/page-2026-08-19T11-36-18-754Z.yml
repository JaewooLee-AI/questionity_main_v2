                  - paragraph [ref=e793]: "Launched last year, FUNCTION is a Toronto-based platform for everything Ballroom: culture, stories, events and education. Recently, they brought Ballroom royalty through our doors for our collaborative “Class of ’23” sessions, an ongoing series centering sexual health, community and movement. We gathered monthly to talk about history, sex ed and the courageous creative expression of voguing, as led by four of Ballroom’s most influential figures. Tears, cheers, breakthrough moments on the floor — the effects of FUNCTION remind us how alive and how staggeringly inextricable sweetness and pain can feel. Here, FUNCTION lays down five pillars of Ballroom."
